<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Roulette</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Love Roulette</h1>
        <p class="subtitle">Spin to see why you're amazing!</p>

        <div class="wheel-container">
            <!-- Outer wooden rim -->
            <div class="wheel-outer-rim"></div>

            <!-- Metal ring -->
            <div class="wheel-metal-ring"></div>

            <!-- Spinning wheel with numbers -->
            <div class="wheel" id="wheel">
                <!-- Segments and dividers created by JS -->
            </div>

            <!-- Inner bowl -->
            <div class="wheel-inner-bowl"></div>

            <!-- Center hub -->
            <div class="center-hub"></div>

            <!-- Ball -->
            <div class="ball" id="ball"></div>
        </div>

        <button id="spinBtn" class="spin-button">
            Spin
        </button>

        <div id="result" class="result hidden">
            <div class="result-number" id="resultNumber"></div>
            <div class="result-message" id="resultMessage"></div>
            <button id="closeResult" class="close-button">Spin Again!</button>
        </div>

        <div id="overlay" class="overlay hidden"></div>
    </div>

    <!-- Audio elements for each number -->
    <div id="audioContainer"></div>

    <script src="script.js"></script>
</body>
</html>
